name = "hexfleet-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[vars]
ALLOWED_ORIGINS = "https://tim-patterson.github.io,http://localhost:5173,http://127.0.0.1:5173"
# TURN_MS and IDLE_MS are intentionally unset here so the Durable Object uses
# the protocol defaults (30s turn clock, 24h idle eviction). Tests override
# them through vitest.config.ts.

[[durable_objects.bindings]]
name = "TABLES"
class_name = "TableDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableDO"]
